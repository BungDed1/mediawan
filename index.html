<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO dasar -->
  <title>Mediawan — Media Berita & Fakta Indonesia</title>
  <meta name="description"
        content="Mediawan adalah media berita & fakta independen. Menyajikan berita terverifikasi, fakta cepat, teknologi, hiburan, dan olahraga dalam Bahasa Indonesia.">
  <meta name="theme-color" content="#0d0d0d">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="Mediawan">
  <meta property="og:title"       content="Mediawan — Media Berita & Fakta Indonesia">
  <meta property="og:description" content="Berita terverifikasi, fakta cepat, teknologi, hiburan, dan olahraga.">
  <meta property="og:image"       content="assets/images/og-cover.jpg">
  <meta property="og:locale"      content="id_ID">

  <!-- Twitter card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Mediawan — Media Berita & Fakta Indonesia">
  <meta name="twitter:description" content="Berita terverifikasi, fakta cepat, teknologi, hiburan, dan olahraga.">

  <!-- Favicon (opsional) -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- HEADER (di-render oleh components.js) -->
  <div id="mw-header"></div>

  <main id="mw-main">

    <!-- HERO: artikel unggulan -->
    <section class="mw-container" id="mw-hero-section" aria-label="Artikel unggulan">
      <div id="mw-hero" class="mw-hero">
        <div class="mw-hero__media mw-skeleton"></div>
        <div>
          <div class="mw-skeleton mw-skeleton--title" style="width:40%"></div>
          <div class="mw-skeleton mw-skeleton--title" style="width:90%;height:36px"></div>
          <div class="mw-skeleton mw-skeleton--text"></div>
          <div class="mw-skeleton mw-skeleton--text" style="width:70%"></div>
        </div>
      </div>
    </section>

    <!-- TERBARU -->
    <section class="mw-container mw-section" aria-labelledby="mw-latest-title">
      <div class="mw-section__head">
        <h2 class="mw-section__title" id="mw-latest-title">Terbaru</h2>
        <a class="mw-section__link" href="pages/category.html?slug=berita">Lihat semua →</a>
      </div>
      <div id="mw-latest" class="mw-grid mw-grid--3">
        <!-- diisi oleh home.js -->
      </div>
    </section>

    <!-- FAKTA CEPAT (carousel horizontal) -->
    <section class="mw-section mw-section--soft" aria-labelledby="mw-facts-title">
      <div class="mw-container">
        <div class="mw-section__head">
          <h2 class="mw-section__title" id="mw-facts-title">Fakta Cepat</h2>
          <a class="mw-section__link" href="pages/category.html?slug=fakta">Selengkapnya →</a>
        </div>
        <div id="mw-facts" class="mw-carousel mw-scroll-x" role="list">
          <!-- diisi oleh home.js -->
        </div>
      </div>
    </section>

    <!-- TERPOPULER -->
    <section class="mw-container mw-section" aria-labelledby="mw-popular-title">
      <div class="mw-section__head">
        <h2 class="mw-section__title" id="mw-popular-title">Terpopuler</h2>
      </div>
      <ul id="mw-popular" class="mw-list">
        <!-- diisi oleh home.js -->
      </ul>
    </section>

    <!-- SURAT KABAR (newsletter) -->
    <section class="mw-container mw-section" aria-labelledby="mw-newsletter-title">
      <div class="mw-section--soft" style="text-align:center;">
        <span class="mw-badge">Surat Kabar</span>
        <h2 class="mw-section__title" id="mw-newsletter-title" style="margin-top:12px;">
          Ringkasan berita terbaik, tiap minggu.
        </h2>
        <p style="max-width:520px; margin:0 auto 20px;">
          Tanpa spam. Hanya berita pilihan dari redaksi Mediawan, langsung ke inbox kamu.
        </p>
        <form class="mw-newsletter" id="mw-newsletter-form"
              style="max-width:480px; margin:0 auto; justify-content:center;">
          <label class="mw-visually-hidden" for="mw-newsletter-email">Email</label>
          <input class="mw-input" id="mw-newsletter-email" type="email"
                 name="email" placeholder="email@kamu.com" required>
          <button class="mw-btn mw-btn--accent" type="submit">Langganan</button>
        </form>
      </div>
    </section>

  </main>

  <!-- FOOTER (di-render oleh components.js) -->
  <div id="mw-footer"></div>

  <!-- Library Supabase (WAJIB dimuat sebelum supabase-client.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- JS inti -->
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>

  <!-- JS halaman -->
  <script src="js/home.js"></script>
</body>
</html>
