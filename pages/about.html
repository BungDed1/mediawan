<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tentang Mediawan — Media Berita & Fakta Indonesia</title>
  <meta name="description" content="Tentang Mediawan, media berita & fakta independen.">
  <meta name="theme-color" content="#0d0d0d">

  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

   <style>
    /* HERO HALAMAN TENTANG — mobile-first */
    .mw-about-hero {
      padding: 20px 0 8px;
      max-width: 780px;
    }
    .mw-about-hero h1 {
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin: 12px 0 12px;
    }
    .mw-about-hero p {
      font-size: 15px;
      color: var(--mw-text-soft);
      line-height: 1.65;
      margin: 0;
    }

    /* NILAI */
    .mw-values {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }
    .mw-value {
      padding: 20px;
      border: 1px solid var(--mw-border);
      border-radius: 14px;
      background: var(--mw-bg-soft);
    }
    .mw-value h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }
    .mw-value p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--mw-text-soft);
    }

    /* CARA KERJA */
    .mw-about-list {
      max-width: 720px;
      color: var(--mw-text-soft);
      line-height: 1.8;
      padding-left: 20px;
      margin: 0;
      font-size: 15px;
    }
    .mw-about-list li { margin-bottom: 8px; }

    /* ---------- TABLET & DESKTOP ---------- */
    @media (min-width: 640px) {
      .mw-about-hero {
        padding: 36px 0 12px;
      }
      .mw-about-hero h1 {
        font-size: 34px;
        line-height: 1.15;
        margin: 16px 0;
      }
      .mw-about-hero p {
        font-size: 17px;
        line-height: 1.7;
      }
      .mw-values {
        gap: 20px;
        grid-template-columns: repeat(3, 1fr);
      }
      .mw-value { padding: 24px; }
      .mw-value h3 { font-size: 17px; }
      .mw-value p { font-size: 15px; }
      .mw-about-list { font-size: 16px; padding-left: 24px; }
    }

    @media (min-width: 900px) {
      .mw-about-hero {
        padding: 48px 0 16px;
      }
      .mw-about-hero h1 {
        font-size: 44px;
        line-height: 1.1;
      }
      .mw-about-hero p {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <div id="mw-header"></div>

  <main id="mw-main" class="mw-container">

    <header class="mw-about-hero">
      <nav class="mw-breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Beranda</a>
        <span>›</span>
        <span>Tentang</span>
      </nav>
      <span class="mw-badge">Tentang Kami</span>
      <h1 id="about-title">Memuat…</h1>
      <p id="about-intro"></p>
    </header>

    <section class="mw-section" aria-labelledby="mw-values-title">
      <div class="mw-section__head">
        <h2 id="mw-values-title" class="mw-section__title">Nilai yang kami pegang</h2>
      </div>
      <div class="mw-values" id="about-values"></div>
    </section>

    <section class="mw-section" aria-labelledby="mw-team-title">
      <div class="mw-section__head">
        <h2 id="mw-team-title" class="mw-section__title">Tim di balik Mediawan</h2>
      </div>
      <div class="mw-team" id="about-team"></div>
    </section>

    <section class="mw-section" aria-labelledby="mw-how-title">
      <div class="mw-section__head">
        <h2 id="mw-how-title" class="mw-section__title">Bagaimana kami bekerja</h2>
      </div>
      <ol class="mw-about-list" id="about-how"></ol>
    </section>

    <section class="mw-section" aria-labelledby="mw-contact-title">
      <div class="mw-section__head">
        <h2 id="mw-contact-title" class="mw-section__title">Kontak</h2>
      </div>
      <p id="about-contact" style="max-width:720px; line-height:1.7; color:var(--mw-text-soft); white-space:pre-line;"></p>
    </section>

  </main>

  <div id="mw-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/settings-store.js"></script>
  <script src="../js/components.js"></script>
  <script src="js/settings-store.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      initPageChrome({ active: "tentang", footer: true });

      const s = await loadSettings();
      const set = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val ?? "";
      };

      set("about-title",   s.about_title || "Media yang mengutamakan fakta, bukan sensasi.");
      set("about-intro",   s.about_intro || "");

      // Nilai
      const values = [1, 2, 3].map((i) => ({
        t: s[`about_value_${i}_t`] || "",
        d: s[`about_value_${i}_d`] || "",
      })).filter((v) => v.t);

      document.getElementById("about-values").innerHTML = values.length
        ? values.map((v) => `
            <div class="mw-value">
              <h3>${escapeHtml(v.t)}</h3>
              <p>${escapeHtml(v.d)}</p>
            </div>
          `).join("")
        : `<p class="mw-text-muted">Belum ada nilai yang ditambahkan.</p>`;

      // Tim
      const team = [
        { name: s.about_founder_name, role: s.about_founder_role, bio: s.about_founder_bio, photo: s.about_founder_photo },
        { name: s.about_team_name,    role: s.about_team_role,    bio: s.about_team_bio,    photo: s.about_team_photo },
      ].filter((x) => x.name);

      document.getElementById("about-team").innerHTML = team.map((t) => `
        <div class="mw-team__card">
          <div class="mw-team__photo">
            ${t.photo
              ? `<img src="${escapeHtml(t.photo)}" alt="Foto ${escapeHtml(t.name)}" loading="lazy">`
              : ""}
          </div>
          <div class="mw-team__name">${escapeHtml(t.name)}</div>
          <div class="mw-team__role">${escapeHtml(t.role)}</div>
          <p class="mw-team__bio">${escapeHtml(t.bio)}</p>
        </div>
      `).join("");

      // Cara kerja
      const hows = [s.about_how_1, s.about_how_2, s.about_how_3, s.about_how_4].filter(Boolean);
      document.getElementById("about-how").innerHTML = hows.map((h) => {
        const [first, ...rest] = String(h).split(".");
        const rest_ = rest.join(".").trim();
        return `<li><strong>${escapeHtml(first)}.</strong> ${escapeHtml(rest_)}</li>`;
      }).join("");

      set("about-contact", s.about_contact || "");
    });
  </script>
</body>
</html>
