<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pencarian — Mediawan</title>
  <meta name="description" content="Cari artikel di Mediawan berdasarkan judul atau isi.">
  <meta name="theme-color" content="#0d0d0d">

  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div id="mw-header"></div>

  <main id="mw-main" class="mw-container mw-section">
    <header style="margin-bottom:32px;">
      <nav class="mw-breadcrumb" aria-label="Breadcrumb">
        <a href="../index.html">Beranda</a>
        <span>›</span>
        <span>Pencarian</span>
      </nav>
      <h1 style="font-size:var(--mw-fs-2xl);">Pencarian</h1>

      <form id="mw-search-form-page" role="search"
            style="display:flex; gap:8px; max-width:560px; margin-top:16px;">
        <label class="mw-visually-hidden" for="mw-search-page-input">Kata kunci</label>
        <input id="mw-search-page-input" class="mw-input" type="search" name="q"
               placeholder="Cari judul atau isi artikel…" autocomplete="off">
        <button class="mw-btn mw-btn--primary" type="submit">Cari</button>
      </form>

      <p id="mw-search-info" class="mw-text-muted" style="margin-top:16px;"></p>
    </header>

    <div id="mw-search-results" class="mw-grid mw-grid--3"></div>
  </main>

  <div id="mw-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/search.js"></script>
</body>
</html>
